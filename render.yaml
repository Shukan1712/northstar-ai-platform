services:
  - type: web
    name: northstar-ai-platform
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.production
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: northstar-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_CHAT_MODEL
        sync: false
      - key: AI_EMBEDDING_MODEL
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MAX_TOOL_ROUNDS
        value: 4
      - key: AI_DAILY_USER_QUOTA
        value: 15
      - key: AI_DAILY_GLOBAL_QUOTA
        value: 75

databases:
  - name: northstar-db
    databaseName: northstar
    user: northstar
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
